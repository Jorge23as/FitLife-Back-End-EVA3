# Sitio de Nginx de FitLife: proxy inverso hacia Gunicorn (ETAPA 6 de la receta).
# deploy/instalar.sh lo copia a /etc/nginx/sites-available/fitlife cambiando
# DOMINIO por el subdominio de DuckDNS, y después certbot le agrega el https.

# login, registro y logout: máximo 10 por minuto por IP (fuerza bruta)
limit_req_zone $binary_remote_addr zone=fitlife_auth:10m rate=10r/m;

# Cualquier nombre que no sea un dominio configurado (por ejemplo la IP
# pública de la instancia) lleva a FitLife con su dominio y certificado.
server {
    listen 80 default_server;
    server_name _;
    return 302 https://DOMINIO$request_uri;
}

server {
    listen 80;
    server_name DOMINIO;
    client_max_body_size 1m;

    # css, js e imágenes: los entrega Nginx directo (collectstatic)
    location /static/ {
        alias /home/ubuntu/apps/fitlife/staticfiles/;
        expires 7d;
    }

    location /api/auth/ {
        limit_req zone=fitlife_auth burst=5 nodelay;
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/apps/fitlife/fitlife.sock;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/home/ubuntu/apps/fitlife/fitlife.sock;
    }

    # recepción usa la cámara para leer los QR (solo este sitio); lo demás, bloqueado
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;
    server_tokens off;

    error_log /var/log/nginx/fitlife_error.log;
    access_log /var/log/nginx/fitlife_access.log;
}
